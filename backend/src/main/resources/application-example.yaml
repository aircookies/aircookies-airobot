server:
  port: 8080

spring:
  application:
    name: your-application-name

  datasource:
    driver-class-name: com.p6spy.engine.spy.P6SpyDriver #  数据库驱动类名
    url: jdbc:p6spy:postgresql://127.0.0.1:5432/your_database_name # 数据库链接url
    username: your_database_username # 数据库用户名
    password: your_database_password # 数据库密码
    hikari:
      pool-name: AI-Robot-HikariCP # 自定义连接池名称
      auto-commit: true # 是否自动提交事务
      connection-timeout: 30000 # 连接超时时间(毫秒)
      idle-timeout: 60000 # 空闲链接存活最大时间(毫秒
      max-lifetime: 180000 # 连接存活最大时间(毫秒)
      minimum-idle: 5 # 最小空闲链接数
      maximum-pool-size: 20 # 连接池大小
      connection-test-query: SELECT 1 # 连接测试查询
      validation-timeout: 5000 # 验证连接超时(毫秒)

  ai:
#    deepseek:
#      api-key:
#      base-url: your_deepseek_base_url
#      chat:
#        model: your_deepseek_model
#        temperature: 0.8
    openai:
      base-url: your_openai_base_url
      api-key:
      chat:
        model: your_openai_chat_model
        temperature: 0.7
      embedding:
        model: your_openai_embedding_model # 向量化模型
        dimensions: 1536 # 维度
    vectorstore:
      pgvector:
        index-type: hnsw  # 向量索引类型
        distance-type: cosine_distance # 向量距离类型
        dimensions: 1536 # 嵌入维度
        max-document-batch-size: 10000 # 每批处理的最大文档数
        table-name: t_vector_store # 向量表名称

okhttp: # OkHttp配置
  connect-timeout: 5000 # 建立连接的最大等待时间(毫秒)
  read-timeout: 30000 # 读取数据的最大等待时间(毫秒)
  write-timeout: 15000 # 写入数据的最大等待时间(毫秒)
  max-idle-connections: 200 # 连接池中保持的最大空闲链接数
  keep-alive-duration: 5 # 空闲链接在连接池中的存活时间(分钟)

searxng: # searxng搜索引擎配置
  url: http://127.0.0.1:8888/search
  count: 10 # 每次从搜索结果中，提取的最大数量

logging:
  config: classpath:log4j2.xml # 日志配置文件

customer-service: # AI智能客服
  md-storage-path: your_md_storage_path  # Markdown 问答文件存储路径
  model: your_model_name  # 模型名称
  temperature: 0.0 # 温度值